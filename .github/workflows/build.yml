name: Build VST3 (Windows x64)

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: windows-latest   # if the SDK rejects the compiler, try: windows-2022

    steps:
      - name: Check out this project
        uses: actions/checkout@v4

      - name: Get the VST 3 SDK (with submodules)
        shell: pwsh
        run: git clone --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk

      - name: Configure (64-bit)
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/vst3sdk" -replace '\\','/'
          cmake -S . -B build -A x64 "-Dvst3sdk_SOURCE_DIR=$sdk" -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: List built .vst3 files
        if: always()
        shell: pwsh
        run: Get-ChildItem -Path build -Recurse -Filter *.vst3 | Select-Object -ExpandProperty FullName

      - name: Upload the plug-in
        uses: actions/upload-artifact@v4
        with:
          name: VelocityRandomiser-win64
          path: build/VST3/Release/
          if-no-files-found: error
